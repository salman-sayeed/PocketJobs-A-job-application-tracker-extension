<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PocketJobs</title>

    <link rel="stylesheet" href="../dist/output.css" />
  </head>

  <body class="bg-gray-900 text-white w-[400px] h-[500px] p-4">
    <div class="w-full flex flex-col gap-4">
      <!-- First Div (HEADER) -->
      <div class="bg-gray-800 py-4 pl-4 flex items-center gap-3 rounded-xl">
        <img src="../icons/logo.png" alt="PocketJobs Logo" class="w-10 h-10" />
        <h1 class="text-3xl font-bold">PocketJobs</h1>
        <h4 class="text-xs opacity-75">
          by
          <a
            href="https://github.com/salman-sayeed"
            target="_blank"
            rel="noopener noreferrer"
            >Salman Sayeed</a
          >
        </h4>
      </div>

      <!-- Second Div (CONTENT) -->
      <div class="bg-gray-800 h-[400px] gap-3 rounded-xl">
        <div class="h-[80px] pt-4 pl-4 pr-4 flex-col w-full">
          <p class="text-sm pb-2 text-white">Job Link</p>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-500 text-white placeholder:text-gray-400 h-[35px] px-4 text-l rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <p class="text-sm pb-2 text-white py-4">Position</p>
          <input
            type="text"
            placeholder=""
            class="w-full bg-gray-500 text-white placeholder:text-gray-400 h-[35px] px-4 text-l rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>
    </div>

    <button class="mt-4 bg-blue-500 px-4 py-2 rounded-lg">Test Button</button>

    <script src="./popup.js"></script>
  </body>
</html>
