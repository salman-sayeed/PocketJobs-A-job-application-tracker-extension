<!-- #764df6 light purple -->
<!-- #5c56ea dark purple  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PocketJobs</title>

    <link rel="stylesheet" href="../dist/output.css" />
  </head>

  <body
    class="bg-gray-900 text-white w-[400px] min-h-[550px] p-4 overflow-hidden"
  >
    <div class="w-full flex flex-col gap-4">
      <!-- First Div (HEADER) -->
      <div class="bg-gray-800 py-4 pl-4 flex items-center gap-3 rounded-xl">
        <img src="../icons/logo.png" alt="PocketJobs Logo" class="w-10 h-10" />
        <h1 class="text-3xl font-bold">PocketJobs</h1>
        <h4 class="text-xs opacity-75">
          <a
            href="https://github.com/salman-sayeed"
            target="_blank"
            rel="noopener noreferrer"
            >by Salman Sayeed</a
          >
        </h4>
      </div>

      <!-- Second Div (CONTENT) -->
      <div class="bg-gray-800 p-4 rounded-xl h-auto">
        <div class="flex flex-col gap-1.5">
          <!-- Job link section -->
          <div class="h-[60px] flex-col w-full">
            <div class="flex items-center gap-1.5 px-1.5 py-1 rounded-md">
              <svg
                xmlns="http://w3.org"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z"
                />
              </svg>
              <p class="text-sm text-white">Job Link</p>
            </div>
            <input
              type="text"
              placeholder=""
              class="w-full bg-gray-500 text-white placeholder:text-gray-400 h-[30px] px-4 text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Company section -->
          <div class="h-[60px] flex-col w-full">
            <div class="flex items-center gap-1.5 px-1.5 py-1 rounded-md">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"
                />
              </svg>

              <p class="text-sm text-white">Company</p>
            </div>

            <input
              type="text"
              placeholder="e.g. Google, Microsoft"
              class="w-full bg-gray-500 text-white placeholder:text-slate-300 h-[30px] px-4 text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Position section -->
          <div class="h-[60px] flex-col w-full">
            <div class="flex items-center gap-1.5 px-1.5 py-1 rounded-md">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z"
                />
              </svg>

              <p class="text-sm text-white">Position</p>
            </div>

            <input
              type="text"
              placeholder="e.g. Software Engineer/Full-Stack Developer"
              class="w-full bg-gray-500 text-white placeholder:text-slate-300 h-[30px] px-4 text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Salary section -->
          <div class="h-[60px] flex-col w-full">
            <div class="flex items-center gap-1.5 px-1.5 py-1 rounded-md">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"
                />
              </svg>

              <p class="text-sm text-white">Salary</p>
            </div>

            <input
              type="text"
              placeholder="e.g. 45000 - 50000"
              class="w-full bg-gray-500 text-white placeholder:text-slate-300 h-[30px] px-4 text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Buttons -->
          <div class="py-3 flex items-center justify-center gap-4 w-full">
            <!-- ADD JOB  -->
            <button
              class="bg-blue-500 hover:bg-blue-600 active:scale-95 hover:scale-[1.03] hover:shadow-md transition-all duration-200 flex-1 h-[30px] flex items-center justify-center rounded-lg font-medium text-white tracking-wide"
            >
              ADD JOB
            </button>
            <!-- CLEAR ALL  -->
            <button
              class="bg-red-500 hover:bg-red-600 active:scale-95 hover:scale-[1.03] hover:shadow-md transition-all duration-200 flex-1 h-[30px] flex items-center justify-center rounded-lg font-medium text-white tracking-wide"
            >
              CLEAR ALL
            </button>
          </div>

          <!-- Extras -->
          <div
            class="bg-gray-700 h-[100px] w-full py-1 px-1 flex items-center justify-center gap-4 rounded-xl"
          >
            <div
              class="bg-gray-600 w-[50%] text-white p-2 rounded-lg flex flex-col justify-center gap-1.5 text-[11px] font-semibold tracking-wide"
            >
              <div class="flex justify-between items-center">
                <span>Applied:</span>
                <span
                  id="applied-count"
                  class="bg-white/20 px-1.5 py-0.5 rounded font-bold text-[10px]"
                  >0</span
                >
              </div>
              <div class="flex justify-between items-center">
                <span>Interviews:</span>
                <span
                  id="interview-count"
                  class="bg-white/20 px-1.5 py-0.5 rounded font-bold text-[10px]"
                  >0</span
                >
              </div>
              <div class="flex justify-between items-center">
                <span>Rejected:</span>
                <span
                  id="rejected-count"
                  class="bg-white/20 px-1.5 py-0.5 rounded font-bold text-[10px]"
                  >0</span
                >
              </div>
            </div>
            <div class="w-[45%] h-[80%] flex flex-col gap-3">
              <button
                class="bg-blue-500 hover:bg-blue-600 active:scale-95 hover:scale-[1.03] hover:shadow-md transition-all duration-200 h-[30px] w-full flex items-center justify-center rounded-lg font-medium text-white tracking-wide"
              >
                View Applied Jobs</button
              ><button
                class="bg-blue-500 hover:bg-blue-600 active:scale-95 hover:scale-[1.03] hover:shadow-md transition-all duration-200 h-[30px] w-full flex items-center justify-center rounded-lg font-medium text-white tracking-wide"
              >
                Export CSV
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./popup.js"></script>
  </body>
</html>
